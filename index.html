
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e11d48">
  <link rel="manifest" href="manifest.json">
  
  <!-- Global Environment Shims -->
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
    window.global = window;
    // Capture early errors
    window.onerror = function(msg, url, line, col, error) {
      console.error('[Boot Error]:', msg, 'at', url, ':', line);
      return false;
    };
  </script>

  <!-- Meta Tags -->
  <title>Read Chinese Menu & Street Guide | AI Translation & Decoder</title>
  <meta name="description" content="Instantly translate Chinese menus and storefronts. Identify hidden lard, animal fats, and allergens.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-title: 'Poppins', sans-serif;
      --font-body: 'Roboto', sans-serif;
      --font-zh: 'Noto Sans SC', sans-serif;
    }
    body {
      font-family: var(--font-body);
      background-color: #fcfbf9;
      color: #1a1a1a;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fcfbf9;
      z-index: 9999;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #e11d48;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .loader-text {
      font-family: var(--font-title);
      font-size: 11px;
      color: #e11d48;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@paypal/react-paypal-js": "https://esm.sh/@paypal/react-paypal-js@^8.9.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body>
  <div id="root">
    <div class="boot-loader">
      <div class="spinner"></div>
      <div class="loader-text">Initializing AI Engine...</div>
    </div>
  </div>
</body>
</html>
